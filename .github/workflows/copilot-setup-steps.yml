name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies for AzDO MCP
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Azure DevOps MCP startup
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.COPILOT_MCP_AZDO_PAT_BASIC }}
        run: |
          if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
            echo "COPILOT_MCP_AZDO_PAT_BASIC is not set; skipping Azure DevOps MCP startup validation."
            exit 0
          fi
          npx -y @azure-devops/mcp ptdigital --authentication pat -d core work-items repositories wiki pipelines search --help >/dev/null

      - name: Validate Jira Rovo MCP prerequisites
        env:
          COPILOT_MCP_JIRA_SITE_URL: ${{ vars.COPILOT_MCP_JIRA_SITE_URL }}
          COPILOT_MCP_JIRA_USER_EMAIL: ${{ vars.COPILOT_MCP_JIRA_USER_EMAIL }}
          COPILOT_MCP_JIRA_API_TOKEN: ${{ secrets.COPILOT_MCP_JIRA_API_TOKEN }}
        run: |
          missing=0

          if [ -z "$COPILOT_MCP_JIRA_SITE_URL" ]; then
            echo "::warning::Missing repo environment variable COPILOT_MCP_JIRA_SITE_URL"
            missing=1
          fi

          if [ -z "$COPILOT_MCP_JIRA_USER_EMAIL" ]; then
            echo "::warning::Missing repo environment variable COPILOT_MCP_JIRA_USER_EMAIL"
            missing=1
          fi

          if [ -z "$COPILOT_MCP_JIRA_API_TOKEN" ]; then
            echo "::warning::Missing repo environment secret COPILOT_MCP_JIRA_API_TOKEN"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "Jira Rovo MCP prerequisites are not fully configured for Copilot sessions yet."
            exit 0
          fi

          echo "Jira Rovo MCP prerequisites are configured."
