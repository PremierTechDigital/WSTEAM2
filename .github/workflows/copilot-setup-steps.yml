name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies for AzDO MCP
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Azure DevOps MCP installation
        run: |
          npx -y @azure-devops/mcp --help >/dev/null
