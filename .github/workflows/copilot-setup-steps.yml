name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies for AzDO MCP
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Azure DevOps MCP startup
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.COPILOT_MCP_AZDO_PAT_BASIC }}
        run: |
          if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
            echo "COPILOT_MCP_AZDO_PAT_BASIC is not set; skipping Azure DevOps MCP startup validation."
            exit 0
          fi
          npx -y @azure-devops/mcp ptdigital --authentication pat -d core work-items repositories wiki pipelines search --help >/dev/null

      - name: Validate Jira Rovo MCP prerequisites
        env:
          COPILOT_MCP_ATLASSIAN_BASIC_AUTH: ${{ secrets.COPILOT_MCP_ATLASSIAN_BASIC_AUTH }}
        run: |
          if [ -z "$COPILOT_MCP_ATLASSIAN_BASIC_AUTH" ]; then
            echo "::warning::Missing repo environment secret COPILOT_MCP_ATLASSIAN_BASIC_AUTH"
            exit 0
          fi

          if ! decoded="$(printf '%s' "$COPILOT_MCP_ATLASSIAN_BASIC_AUTH" | base64 --decode 2>/dev/null)" ||
             [[ "$decoded" != *:* ]] ||
             [ -z "${decoded%%:*}" ] ||
             [ -z "${decoded#*:}" ]; then
            echo "::warning::COPILOT_MCP_ATLASSIAN_BASIC_AUTH must be Base64-encoded email:api_token without the Basic prefix"
            exit 0
          fi

          echo "Jira Rovo MCP Basic authentication is configured."
